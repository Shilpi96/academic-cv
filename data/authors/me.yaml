bio: |
 I am a solar physicist studying solar eruptions through multiwavelength
  observations from space-based missions and ground-based radio observatories.
  My research focuses on solar flares, coronal mass ejections, and energetic
  solar phenomena. I work with complex observational data and enjoy developing
  software tools that transform raw instrument data into calibrated,
  science-ready datasets for advanced scientific analysis.
